[package]
name = "flock"
version = "0.1.0"
description = "An always-on-top analog clock"
authors = ["Flock"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "flock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# `tray-icon` for the tray, `macos-private-api` for transparent macOS windows,
# `image-png` so the monochrome tray glyph can be decoded at runtime.
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Rust is the network/session boundary for the todo API, so no remote origin is needed in the CSP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# API key and secret live in the OS credential store (Keychain / Credential Manager / Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
