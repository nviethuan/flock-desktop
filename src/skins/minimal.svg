<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Analog clock">
  <circle id="face" cx="100" cy="100" r="96" fill="#0f1319" fill-opacity="0.42" />
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#f2f5fa" stroke-opacity="0.35" stroke-width="1" />

  <!-- Index ticks at the hours and quarters -->
  <g stroke="#f2f5fa" stroke-opacity="0.45">
    <line x1="100" y1="12" x2="100" y2="18" stroke-width="1.2" />
    <line x1="100" y1="182" x2="100" y2="188" stroke-width="1.2" />
    <line x1="12" y1="100" x2="18" y2="100" stroke-width="1.2" />
    <line x1="182" y1="100" x2="188" y2="100" stroke-width="1.2" />
    <line x1="143.8" y1="27.7" x2="140.7" y2="32.9" stroke-width="1.2" />
    <line x1="172.3" y1="56.2" x2="167.1" y2="59.3" stroke-width="1.2" />
    <line x1="172.3" y1="143.8" x2="167.1" y2="140.7" stroke-width="1.2" />
    <line x1="143.8" y1="172.3" x2="140.7" y2="167.1" stroke-width="1.2" />
    <line x1="56.2" y1="172.3" x2="59.3" y2="167.1" stroke-width="1.2" />
    <line x1="27.7" y1="143.8" x2="32.9" y2="140.7" stroke-width="1.2" />
    <line x1="27.7" y1="56.2" x2="32.9" y2="59.3" stroke-width="1.2" />
    <line x1="56.2" y1="27.7" x2="59.3" y2="32.9" stroke-width="1.2" />
  </g>

  <g id="hour-hand">
    <line x1="100" y1="56" x2="100" y2="100" stroke="#f7f9fc" stroke-width="6" stroke-linecap="round" />
  </g>
  <g id="minute-hand">
    <line x1="100" y1="22" x2="100" y2="100" stroke="#f7f9fc" stroke-width="3.4" stroke-linecap="round" />
  </g>
  <g id="second-hand">
    <line x1="100" y1="116" x2="100" y2="18" stroke="#5ec8ff" stroke-width="1.4" stroke-linecap="round" />
  </g>
  <circle cx="100" cy="100" r="3.4" fill="#5ec8ff" />
</svg>
