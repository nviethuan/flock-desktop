<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Analog clock">
  <defs>
    <radialGradient id="flock-face" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2a3242" />
      <stop offset="62%" stop-color="#171d27" />
      <stop offset="100%" stop-color="#0c1017" />
    </radialGradient>
    <linearGradient id="flock-bezel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#8b97ab" />
      <stop offset="45%" stop-color="#39414f" />
      <stop offset="100%" stop-color="#1b212b" />
    </linearGradient>
  </defs>

  <circle id="face" cx="100" cy="100" r="98" fill="url(#flock-bezel)" />
  <circle cx="100" cy="100" r="92" fill="url(#flock-face)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="1" />

  <!-- Hour ticks (outer radius 88, inner radius 78) -->
  <g stroke="#dbe3ef" stroke-linecap="round">
    <line x1="100" y1="12" x2="100" y2="22" stroke-width="3" />
    <line x1="144" y1="23.8" x2="139" y2="32.5" stroke-width="2" />
    <line x1="176.2" y1="56" x2="167.5" y2="61" stroke-width="2" />
    <line x1="188" y1="100" x2="178" y2="100" stroke-width="3" />
    <line x1="176.2" y1="144" x2="167.5" y2="139" stroke-width="2" />
    <line x1="144" y1="176.2" x2="139" y2="167.5" stroke-width="2" />
    <line x1="100" y1="188" x2="100" y2="178" stroke-width="3" />
    <line x1="56" y1="176.2" x2="61" y2="167.5" stroke-width="2" />
    <line x1="23.8" y1="144" x2="32.5" y2="139" stroke-width="2" />
    <line x1="12" y1="100" x2="22" y2="100" stroke-width="3" />
    <line x1="23.8" y1="56" x2="32.5" y2="61" stroke-width="2" />
    <line x1="56" y1="23.8" x2="61" y2="32.5" stroke-width="2" />
  </g>

  <!-- Numerals -->
  <g fill="#97a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="100" y="48">12</text>
    <text x="157" y="104.5">3</text>
    <text x="100" y="162">6</text>
    <text x="43" y="104.5">9</text>
  </g>

  <g id="hour-hand">
    <rect x="96.4" y="52" width="7.2" height="52" rx="3.6" fill="#eef2f8" />
  </g>
  <g id="minute-hand">
    <rect x="97.1" y="28" width="5.8" height="78" rx="2.9" fill="#eef2f8" fill-opacity="0.92" />
  </g>
  <g id="second-hand">
    <line x1="100" y1="118" x2="100" y2="22" stroke="#ff6b5e" stroke-width="1.9" stroke-linecap="round" />
    <circle cx="100" cy="118" r="2.8" fill="#ff6b5e" />
  </g>
  <circle cx="100" cy="100" r="4.4" fill="#eef2f8" />
  <circle cx="100" cy="100" r="2" fill="#1b212b" />
</svg>
